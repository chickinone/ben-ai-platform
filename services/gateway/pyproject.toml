[project]
name = "ben-gateway"
version = "0.1.0"
description = "AI Gateway của Bến"
requires-python = ">=3.12"
dependencies = [
  "ben-common",
  "ben-telemetry",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
