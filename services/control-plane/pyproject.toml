[project]
name = "ben-control-plane"
version = "0.1.0"
description = "Control plane của Bến. Tuần 2: migration schema; tuần 10: API quản trị"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
