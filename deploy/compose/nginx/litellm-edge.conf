# Bề mặt API công khai của Bến. LiteLLM vẫn là data plane; Nginx chỉ giới hạn
# route để endpoint passthrough không thể bỏ qua các bảo đảm guardrail.
server {
    listen 8080;
    server_name _;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health/liveliness {
        proxy_pass http://litellm:4000;
    }

    location = /health/readiness {
        proxy_pass http://litellm:4000;
    }

    location = /v1/chat/completions {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_pass http://litellm:4000;
    }

    location = /v1/embeddings {
        proxy_pass http://litellm:4000;
    }

    location = /v1/messages {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_pass http://litellm:4000;
    }

    # Đặc biệt chặn Anthropic passthrough: guardrail LiteLLM chỉ chạy một chiều
    # trên đường này (xem ADR-017), nên response có thể không khôi phục PII.
    location ^~ /anthropic/ {
        return 404;
    }

    location / {
        return 404;
    }
}
