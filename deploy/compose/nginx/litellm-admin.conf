# Chỉ dùng ở localhost cho script seed, test tích hợp và UI quản trị LiteLLM.
# Proxy LiteLLM không expose port trực tiếp; kể cả trên máy dev cũng không có
# đường gọi /anthropic/v1/messages bỏ qua edge public.
server {
    listen 8080;
    server_name _;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health/liveliness {
        proxy_pass http://litellm:4000;
    }

    location = /health/readiness {
        proxy_pass http://litellm:4000;
    }

    location ~ ^/(team|key)/ {
        proxy_pass http://litellm:4000;
    }

    location = /ui {
        proxy_pass http://litellm:4000;
    }

    location /ui/ {
        proxy_pass http://litellm:4000;
    }

    location / {
        return 404;
    }
}
