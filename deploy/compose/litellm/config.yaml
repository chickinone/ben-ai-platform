# Cấu hình LiteLLM Proxy của Bến (ADR-017).
# Plugin nạp từ ben_guardrails.py / ben_callbacks.py cùng thư mục; code thật ở libs/ben_litellm_plugins.

model_list:
  # --- Mock provider cho dev và test tích hợp (tools/mock_llm) ---
  - model_name: mock-cloud-small
    litellm_params:
      model: openai/mock-cloud-small
      api_base: http://mock-llm-cloud:8080/v1
      api_key: os.environ/MOCK_API_KEY
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
    model_info:
      ben_residency: cloud

  - model_name: mock-local-small
    litellm_params:
      model: openai/mock-local-small
      api_base: http://mock-llm-local:8080/v1
      api_key: os.environ/MOCK_API_KEY
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      ben_residency: local

  - model_name: mock-claude
    litellm_params:
      model: anthropic/claude-mock
      api_base: http://mock-llm-cloud:8080
      api_key: os.environ/MOCK_API_KEY
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
    model_info:
      ben_residency: cloud

  # --- Model local thật: cần tải model trước (tasks.ps1 pull-model qwen2.5:7b) ---
  - model_name: local-qwen
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: http://ollama:11434
    model_info:
      ben_residency: local

  # --- Claude thật: cần ANTHROPIC_API_KEY trong .env; kiểm chứng giá và hành vi ở tuần 4 ---
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      ben_residency: cloud

  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      ben_residency: cloud

router_settings:
  num_retries: 0
  fallbacks:
    - mock-cloud-small: ["mock-local-small"]
    # local → cloud tồn tại có chủ đích: governance phải chặn được rò rỉ (test tích hợp)
    - mock-local-small: ["mock-cloud-small"]

litellm_settings:
  drop_params: true
  # Payload logging chạy sau khi response đã khôi phục PII → không đưa nội dung vào (thử nghiệm ADR-017)
  turn_off_message_logging: true
  callbacks: ben_callbacks.usage_logger
  # Cache tắt cho đến khi có ADR-007

guardrails:
  - guardrail_name: ben-governance
    litellm_params:
      guardrail: ben_guardrails.BenGovernanceGuardrail
      mode: ["pre_call"]
      default_on: true
  - guardrail_name: ben-pii
    litellm_params:
      guardrail: ben_guardrails.BenPIIGuardrail
      mode: ["pre_call", "post_call"]
      default_on: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Ghi spend xuống DB thường xuyên hơn mặc định để ngân sách phản ứng nhanh ở dev
  proxy_batch_write_at: 2
